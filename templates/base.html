<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}Agenda de colaboradores{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos propios -->
    <link
        href="{{ url_for('static', filename='css/estilos.css') }}"
        rel="stylesheet">
</head>

<body>

    <!-- Menu -->
    <nav class="bg-success p-3">
        <div class="container">
            <a class="text-white fw-bold me-4" href="/">
                Agenda de colaboradores
            </a>

            <a class="text-white me-3" href="/">Inicio</a>

            <a class="text-white me-3" href="/registro">Registro</a>

            <a class="text-white me-3" href="/colaboradores">
                Colaboradores
            </a>

            <a class="text-white" href="/resumen">Resumen por día</a>
        </div>
    </nav>

    <!-- Contenido -->
    <main class="container my-5">
        {% block contenido %}

        <div class="bg-white border rounded p-4 text-center">
            <h1 class="text-success">
                Bienvenido a la agenda de colaboradores
            </h1>

            <p>
                Registrá colaboradores, consultá sus datos
                y revisá sus días de turno.
            </p>
        </div>

        {% endblock %}
    </main>

    <!-- Pie de pagina -->
    <footer class="bg-success text-white text-center p-3">
        <p class="mb-0">
            Desarrollo Web — Universidad Mariano Gálvez
        </p>
    </footer>

</body>
</html>
